<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB7C5"/>
      <stop offset="100%" style="stop-color:#E8D5F5"/>
    </linearGradient>
    <linearGradient id="center" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD6E7"/>
      <stop offset="100%" style="stop-color:#FFB7C5"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- 桜の花びら (5枚) -->
  <g transform="translate(64,55)">
    <ellipse cx="0" cy="-20" rx="9" ry="14" fill="white" opacity="0.92" transform="rotate(0)"/>
    <ellipse cx="0" cy="-20" rx="9" ry="14" fill="white" opacity="0.92" transform="rotate(72)"/>
    <ellipse cx="0" cy="-20" rx="9" ry="14" fill="white" opacity="0.92" transform="rotate(144)"/>
    <ellipse cx="0" cy="-20" rx="9" ry="14" fill="white" opacity="0.92" transform="rotate(216)"/>
    <ellipse cx="0" cy="-20" rx="9" ry="14" fill="white" opacity="0.92" transform="rotate(288)"/>
    <!-- 中心 -->
    <circle cx="0" cy="0" r="12" fill="url(#center)"/>
    <circle cx="0" cy="0" r="5" fill="white" opacity="0.7"/>
    <!-- 花芯の点 -->
    <circle cx="0" cy="-4" r="1.5" fill="#FFB7C5"/>
    <circle cx="3.5" cy="2" r="1.5" fill="#FFB7C5"/>
    <circle cx="-3.5" cy="2" r="1.5" fill="#FFB7C5"/>
  </g>
  <!-- テキスト -->
  <text x="64" y="108" text-anchor="middle"
        font-size="18" font-family="-apple-system,Helvetica,sans-serif"
        font-weight="900" fill="#7a2060" letter-spacing="1">
    English Buddy
  </text>
</svg>
